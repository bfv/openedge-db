name: CI 

on: 
  [ push, workflow_dispatch ]

permissions:
  contents: read
  packages: read
      
jobs:
  build:
    
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        version: [ 12.8.12 ]
    
    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: src

      - name: Get OpenEdge version
        id: get-oeversion
        uses: bfv/openedge-flatversion@cd00d571e79c7a7be1d1d0ecce22febb2fb7dd0c  # v1.2.3
        with:
          version: ${{matrix.version}}

      - name: Version to env
        run: |
          echo "FLATVERSION=${{ steps.get-oeversion.outputs.flat-version }}" >> $GITHUB_ENV
          echo "OPENEDGE_VERSION=${{matrix.version}}" >> $GITHUB_ENV
          echo "OPENEDGE_BASE_VERSION=${{ steps.get-oeversion.outputs.base-version }}" >> $GITHUB_ENV
  
      - name: Insert JDK version in Dockerfile
        run: |
          jdk=`jq -r ".jdk${FLATVERSION}" src/jdk-versions.json`
          echo JDK: $jdk
          sed -i "s/JDKVERSION/$jdk/g" src/Dockerfile-gh
          echo download jdk from Dockerfile:
          cat src/Dockerfile | grep temurin
  
      - name: Download installer files
        run: |
          src/scripts/download-openedge.sh
      
      - name: Get response.ini and progress.cfg
        env:
          RESPONSE_INI: ${{ secrets[format('RESPONSE_INI_{0}', env.FLATVERSION)] }}
          PROGRESS_CFG: ${{ secrets[format('PROGRESS_CFG_{0}', env.FLATVERSION)] }}
        run: |
          printf '%s\n' "$RESPONSE_INI" > src/response.ini
          printf '%s' "$PROGRESS_CFG" | base64 --decode > src/progress.cfg

      - name: Build docker image
        run: |
          cd src
          docker build -f Dockerfile-gh -t openedge-db:${{env.OPENEDGE_VERSION}} .

      - name: Remove installer files
        if: always()
        run: |
          rm -f src/PROGRESS_* src/response.ini src/progress.cfg
      